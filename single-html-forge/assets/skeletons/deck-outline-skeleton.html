<!DOCTYPE html>
<html lang="ja" data-shf-archetype="deck" data-shf-layout="outline" data-shf-runtime="3" data-shf-css="3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck skeleton (outline)</title>
<style id="shf-theme">:root{--shf-color-accent:#0067b8;--shf-color-bg:#ffffff;--shf-color-fg:#1b1f27;--shf-size-base:20px}</style>
<style id="shf-css">/* single-html-forge deck template v1 — hash-pinned.
 * Every variable value arrives through a --shf-* custom property.
 */
:root {
  --shf-color-bg: #ffffff;
  --shf-color-fg: #1b1f27;
  --shf-color-muted: #5b6472;
  --shf-color-accent: #0067b8;
  --shf-color-surface: #f6f8fb;
  --shf-color-line: #e1e5eb;
  --shf-size-base: 20px;
  --shf-scale-step: 1.25;
  --shf-space-gap: 24px;
  --shf-radius-card: 12px;
  --shf-weight-display: 700;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0d0f13;
}

body {
  font-family:
    "Segoe UI", "Yu Gothic UI", "Hiragino Sans", Meiryo, system-ui, sans-serif;
  font-feature-settings: "palt" 1;
  line-break: strict;
  overflow-wrap: anywhere;
  color: var(--shf-color-fg);
  display: grid;
  place-items: center;
}

/* 16:9 stage that scales to the viewport without changing layout maths. */
#shf-root {
  width: 100vw;
  height: 56.25vw;
  max-height: 100vh;
  max-width: 177.78vh;
  position: relative;
  background: var(--shf-color-bg);
  container-type: size;
  overflow: hidden;
}

[data-slide-id] {
  position: absolute;
  inset: 0;
  padding: 6cqw 7cqw;
  display: flex;
  flex-direction: column;
  gap: var(--shf-space-gap);
  font-size: 2.6cqw;
  line-height: 1.7;
}

[data-slide-id][hidden] {
  display: none;
}

[data-slide-id] h1 {
  font-size: 6.2cqw;
  line-height: 1.25;
  margin: 0;
  font-weight: var(--shf-weight-display);
  letter-spacing: -0.01em;
}

[data-slide-id] h2 {
  font-size: 4.4cqw;
  line-height: 1.3;
  margin: 0;
  font-weight: var(--shf-weight-display);
}

[data-slide-id] h2::after {
  content: "";
  display: block;
  width: 2.6em;
  height: 0.14em;
  margin-top: 0.4em;
  background: var(--shf-color-accent);
}

[data-slide-id] p {
  margin: 0;
}
[data-slide-id] ul,
[data-slide-id] ol {
  margin: 0;
  padding-left: 1.3em;
}
[data-slide-id] li {
  margin: 0.35em 0;
}

.shf-lead {
  color: var(--shf-color-muted);
  font-size: 2.2cqw;
}

.shf-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
  gap: var(--shf-space-gap);
}

.shf-card {
  background: var(--shf-color-surface);
  border: 1px solid var(--shf-color-line);
  border-top: 0.25em solid var(--shf-color-accent);
  border-radius: var(--shf-radius-card);
  padding: 1.1em 1.2em;
}

.shf-card h3 {
  margin: 0 0 0.4em;
  font-size: 2.5cqw;
  color: var(--shf-color-accent);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 2.1cqw;
}

th,
td {
  border-bottom: 1px solid var(--shf-color-line);
  padding: 0.55em 0.7em;
  text-align: left;
  vertical-align: top;
}

th {
  background: var(--shf-color-surface);
  font-weight: var(--shf-weight-display);
}

img,
svg {
  max-width: 100%;
  height: auto;
}

code,
pre {
  font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
  font-feature-settings: normal;
}

pre {
  background: var(--shf-color-surface);
  border: 1px solid var(--shf-color-line);
  border-radius: var(--shf-radius-card);
  padding: 0.9em 1em;
  overflow: auto;
  font-size: 1.9cqw;
}

a {
  color: var(--shf-color-accent);
}

/* chrome */
#shf-chrome {
  position: absolute;
  right: 1.6cqw;
  bottom: 1.2cqw;
  display: flex;
  align-items: center;
  gap: 0.6em;
  font-size: 1.6cqw;
  color: var(--shf-color-muted);
}

#shf-chrome button {
  font: inherit;
  color: inherit;
  background: var(--shf-color-surface);
  border: 1px solid var(--shf-color-line);
  border-radius: 999px;
  padding: 0.25em 0.9em;
  cursor: pointer;
}

#shf-chrome button:hover {
  border-color: var(--shf-color-accent);
  color: var(--shf-color-accent);
}

[data-shf-notes] {
  display: none;
}

/* presenter overlay lives in the document and is only toggled */
#shf-presenter {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #0d0f13;
  color: #f2f4f7;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto 1fr;
  gap: 20px;
  padding: 28px;
  font-size: 16px;
  line-height: 1.7;
}

#shf-presenter[hidden] {
  display: none;
}
#shf-presenter h4 {
  margin: 0 0 6px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: #9fb0c4;
  text-transform: uppercase;
}
#shf-presenter .shf-pane {
  background: #171b22;
  border: 1px solid #262d38;
  border-radius: 12px;
  padding: 16px 18px;
  overflow: auto;
}
#shf-presenter-clock {
  font-size: 34px;
  font-variant-numeric: tabular-nums;
}
#shf-presenter-notes {
  white-space: pre-wrap;
}
.shf-presenter-head {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

/* ---------- outline layout ----------
 * Opt in with <html data-shf-layout="outline">. Sizes stay explicit because
 * #shf-root carries container-type: size, which resolves an auto height to 0.
 */

html[data-shf-layout="outline"] body {
  display: flex;
  align-items: center;
  justify-content: flex-start;
}

#shf-outline {
  display: none;
}

html[data-shf-layout="outline"] #shf-outline {
  display: block;
  flex: 0 0 264px;
  height: 100vh;
  overflow-y: auto;
  padding: 22px 14px;
  background: #11151c;
  color: #e6ecf3;
}

html[data-shf-layout="outline"].shf-outline-off #shf-outline {
  display: none;
}

#shf-outline .shf-outline-title {
  margin: 0 0 14px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: #8fa3bb;
}

#shf-outline ol {
  list-style: none;
  margin: 0;
  padding: 0;
  counter-reset: shf-toc;
}

#shf-outline li {
  counter-increment: shf-toc;
}

#shf-outline button {
  display: block;
  width: 100%;
  margin-bottom: 3px;
  padding: 9px 10px;
  font: inherit;
  font-size: 13px;
  line-height: 1.5;
  text-align: left;
  color: #e6ecf3;
  background: transparent;
  border: 0;
  border-left: 3px solid transparent;
  border-radius: 7px;
  cursor: pointer;
}

#shf-outline button::before {
  content: counter(shf-toc, decimal-leading-zero);
  margin-right: 9px;
  font-weight: 800;
  color: #6f8299;
}

#shf-outline button:hover {
  background: rgba(255, 255, 255, 0.08);
}

#shf-outline button.is-current {
  background: rgba(255, 255, 255, 0.14);
  border-left-color: var(--shf-color-accent);
}

#shf-outline button.is-current::before {
  color: var(--shf-color-accent);
}

html[data-shf-layout="outline"] #shf-root {
  width: calc(100vw - 264px);
  height: calc((100vw - 264px) * 0.5625);
  max-width: 177.78vh;
  max-height: 100vh;
  margin: auto;
}

html[data-shf-layout="outline"].shf-outline-off #shf-root {
  width: 100vw;
  height: 56.25vw;
}

@media print {
  /* The stage carries container-type: size so slides can use cqw units. Size
   * containment makes height:auto resolve to 0, which combined with the stage's
   * overflow:hidden clipped every slide away in PDF output. Moving the container
   * down to each slide keeps cqw working and lets the stage grow. */
  html,
  body {
    height: auto;
  }
  body {
    background: #fff;
    display: block;
  }
  #shf-root {
    width: 100%;
    height: auto;
    max-width: none;
    max-height: none;
    container-type: normal;
    overflow: visible;
  }
  [data-slide-id] {
    position: static;
    break-after: page;
    height: 100vh;
    container-type: size;
  }
  [data-slide-id]:last-of-type {
    break-after: auto;
  }
  [data-slide-id][hidden] {
    display: flex;
  }
  #shf-chrome,
  #shf-presenter,
  #shf-outline {
    display: none;
  }
  /* The layout-scoped rule above is more specific than a bare id, and a media
   * query adds no specificity, so it has to be matched here to be overridden. */
  html[data-shf-layout="outline"] #shf-outline {
    display: none;
  }
  html[data-shf-layout="outline"] body {
    display: block;
  }
  html[data-shf-layout="outline"] #shf-root {
    width: 100%;
    height: auto;
    max-width: none;
    max-height: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
<nav id="shf-outline">
<p class="shf-outline-title">SLIDES</p>
<ol>
<li><button type="button" data-shf-goto="s1">タイトルをここに置く</button></li>
<li><button type="button" data-shf-goto="s2">3 つの論点</button></li>
<li><button type="button" data-shf-goto="s3">比較</button></li>
</ol>
</nav>
<main id="shf-root">
<section data-slide-id="s1" class="is-active">
<p class="shf-eyebrow">SINGLE HTML FORGE</p>
<h1>タイトルをここに置く</h1>
<p class="shf-lead">副題。1 行で主張を言い切る。</p>
<p data-shf-notes>話者メモ。発表者モードにだけ出る。</p>
</section>
<section data-slide-id="s2" hidden>
<h2>3 つの論点</h2>
<div class="shf-cards">
<div class="shf-card"><h3>論点 1</h3><p>短く書く。読ませるのではなく見せる。</p></div>
<div class="shf-card"><h3>論点 2</h3><p>1 枚に詰め込まない。</p></div>
<div class="shf-card"><h3>論点 3</h3><p>数字は表に逃がす。</p></div>
</div>
<p data-shf-notes>ここで一度止まって質問を取る。</p>
</section>
<section data-slide-id="s3" hidden>
<h2>比較</h2>
<table>
<thead><tr><th>観点</th><th>従来</th><th>今回</th></tr></thead>
<tbody>
<tr><td>配布</td><td>専用アプリが要る</td><td>ブラウザーだけ</td></tr>
<tr><td>依存</td><td>外部リソース</td><td>単一ファイル</td></tr>
</tbody>
</table>
<p data-shf-notes>表は 5 行を超えたら分割する。</p>
</section>
<div id="shf-chrome">
<button type="button" data-shf-action="prev">前へ</button>
<span id="shf-slide-counter">1 / 3</span>
<button type="button" data-shf-action="next">次へ</button>
<button type="button" data-shf-action="presenter">発表者</button>
<button type="button" data-shf-action="outline">目次</button>
<button type="button" data-shf-action="print">PDF</button>
</div>
</main>
<div id="shf-presenter" hidden>
<div class="shf-presenter-head">
<h4>PRESENTER</h4>
<span id="shf-presenter-clock">00:00</span>
</div>
<div class="shf-pane">
<h4>現在</h4>
<p id="shf-presenter-now"></p>
<h4>次</h4>
<p id="shf-presenter-next"></p>
</div>
<div class="shf-pane">
<h4>メモ</h4>
<p id="shf-presenter-notes"></p>
</div>
</div>
<script id="shf-model" type="application/json">{"schemaVersion":1,"profileId":"base","profileVersion":1,"assets":[]}</script>
<script id="shf-runtime">/* single-html-forge fixed runtime v1
 *
 * Hash-pinned. Obeys the dataflow invariants in references/artifact-grammar.md:
 * it never creates elements, never writes markup, never touches CSSOM, and
 * never builds a URL. Every element it touches already exists in the artifact.
 */
(function () {
  "use strict";

  var root = document.documentElement;
  var archetype = root.getAttribute("data-shf-archetype");

  function all(sel) {
    return Array.prototype.slice.call(document.querySelectorAll(sel));
  }

  /* ---------- deck ---------- */

  function initDeck() {
    var slides = all("[data-slide-id]");
    if (slides.length === 0) return;

    var index = 0;
    var counter = document.getElementById("shf-slide-counter");
    var presenter = document.getElementById("shf-presenter");
    var pNow = document.getElementById("shf-presenter-now");
    var pNext = document.getElementById("shf-presenter-next");
    var pNotes = document.getElementById("shf-presenter-notes");
    var pClock = document.getElementById("shf-presenter-clock");
    var started = Date.now();
    var ticking = null;
    var tocLinks = all("[data-shf-goto]");

    function noteFor(i) {
      var n = slides[i] ? slides[i].querySelector("[data-shf-notes]") : null;
      return n ? n.textContent : "";
    }

    function titleFor(i) {
      if (!slides[i]) return "";
      var h = slides[i].querySelector("h1, h2, h3");
      return h ? h.textContent : slides[i].getAttribute("data-slide-id");
    }

    function render() {
      for (var i = 0; i < slides.length; i++) {
        var active = i === index;
        slides[i].classList.toggle("is-active", active);
        slides[i].hidden = !active;
        slides[i].setAttribute("aria-hidden", active ? "false" : "true");
      }
      if (counter) {
        counter.textContent = index + 1 + " / " + slides.length;
      }
      if (pNow) pNow.textContent = titleFor(index);
      if (pNext) {
        pNext.textContent =
          index + 1 < slides.length ? titleFor(index + 1) : "\u2014";
      }
      if (pNotes) pNotes.textContent = noteFor(index);
      var here = slides[index] ? slides[index].getAttribute("data-slide-id") : "";
      tocLinks.forEach(function (link) {
        var on = link.getAttribute("data-shf-goto") === here;
        link.classList.toggle("is-current", on);
        if (on) link.setAttribute("aria-current", "true");
        else link.removeAttribute("aria-current");
      });
    }

    function go(next) {
      if (next < 0) next = 0;
      if (next > slides.length - 1) next = slides.length - 1;
      index = next;
      render();
    }

    function pad(n) {
      return n < 10 ? "0" + n : "" + n;
    }

    function tick() {
      if (!pClock) return;
      var s = Math.floor((Date.now() - started) / 1000);
      pClock.textContent = pad(Math.floor(s / 60)) + ":" + pad(s % 60);
    }

    function togglePresenter() {
      if (!presenter) return;
      var on = presenter.hidden;
      presenter.hidden = !on;
      document.body.classList.toggle("shf-presenting", on);
      if (on) {
        started = Date.now();
        tick();
        ticking = window.setInterval(tick, 1000);
      } else if (ticking !== null) {
        window.clearInterval(ticking);
        ticking = null;
      }
    }

    document.addEventListener("keydown", function (e) {
      if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
      var k = e.key;
      if (k === "ArrowRight" || k === "PageDown" || k === " ") {
        go(index + 1);
        e.preventDefault();
      } else if (k === "ArrowLeft" || k === "PageUp") {
        go(index - 1);
        e.preventDefault();
      } else if (k === "Home") {
        go(0);
        e.preventDefault();
      } else if (k === "End") {
        go(slides.length - 1);
        e.preventDefault();
      } else if (k === "s" || k === "S") {
        togglePresenter();
        e.preventDefault();
      } else if (k === "o" || k === "O") {
        root.classList.toggle("shf-outline-off");
        e.preventDefault();
      }
    });

    function indexOfSlide(id) {
      for (var i = 0; i < slides.length; i++) {
        if (slides[i].getAttribute("data-slide-id") === id) return i;
      }
      return -1;
    }

    tocLinks.forEach(function (link) {
      link.addEventListener("click", function (e) {
        var found = indexOfSlide(link.getAttribute("data-shf-goto"));
        if (found >= 0) {
          go(found);
          e.preventDefault();
        }
      });
    });

    all("[data-shf-action]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var action = btn.getAttribute("data-shf-action");
        if (action === "next") go(index + 1);
        else if (action === "prev") go(index - 1);
        else if (action === "presenter") togglePresenter();
        else if (action === "outline") root.classList.toggle("shf-outline-off");
      });
    });

    render();
  }

  /* ---------- doc ---------- */

  function initDoc() {
    var sections = all("main section[id]");
    var links = all("[data-shf-navlink]");
    if (sections.length === 0 || links.length === 0) return;

    function activate(id) {
      links.forEach(function (a) {
        var on = a.getAttribute("data-shf-navlink") === id;
        a.classList.toggle("is-current", on);
        if (on) a.setAttribute("aria-current", "true");
        else a.removeAttribute("aria-current");
      });
    }

    if (typeof window.IntersectionObserver !== "function") {
      activate(sections[0].id);
      return;
    }

    var seen = Object.create(null);
    var io = new window.IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          seen[entry.target.id] = entry.isIntersecting
            ? entry.intersectionRatio
            : 0;
        });
        var best = null;
        var bestRatio = 0;
        sections.forEach(function (s) {
          var r = seen[s.id] || 0;
          if (r > bestRatio) {
            bestRatio = r;
            best = s.id;
          }
        });
        if (best) activate(best);
      },
      { rootMargin: "-10% 0px -70% 0px", threshold: [0, 0.25, 0.5, 1] },
    );
    sections.forEach(function (s) {
      io.observe(s);
    });
    activate(sections[0].id);
  }

  /* ---------- print ---------- */

  function initPrint() {
    all('[data-shf-action="print"]').forEach(function (btn) {
      btn.addEventListener("click", function () {
        window.print();
      });
    });
  }

  /* ---------- boot ---------- */

  initPrint();
  if (archetype === "deck") initDeck();
  else if (archetype === "doc") initDoc();
  /* poster is static apart from the print button */
})();
</script>
</body>
</html>
